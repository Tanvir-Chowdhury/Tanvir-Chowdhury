<g clip-path="url(#clip)">
  <rect width="1200" height="260" fill="#0F0F12"/>
  
  <rect x="180.0" y="0" width="840.0" height="1" fill="url(#edge)"/>
  <text class="m" x="56" y="66" font-size="13" letter-spacing="2" fill="#71717A">WHAT CLIENTS SAY</text><text x="56.0" y="112" font-size="18" fill="#FAFAFA" fill-opacity="0.9">Tanvir built a great website for</text><text x="56.0" y="139" font-size="18" fill="#FAFAFA" fill-opacity="0.9">me last time. That's exactly why I</text><text x="56.0" y="166" font-size="18" fill="#FAFAFA" fill-opacity="0.9">came back for my next project.</text>
<text x="56.0" y="216" font-size="15" font-weight="600" fill="#FAFAFA">Ahein</text>
<text x="56.0" y="236" font-size="13" fill="#71717A">Returning client</text><text x="418.6666666666667" y="112" font-size="18" fill="#FAFAFA" fill-opacity="0.9">He's done a great job with our</text><text x="418.6666666666667" y="139" font-size="18" fill="#FAFAFA" fill-opacity="0.9">marketing and played a big part in</text><text x="418.6666666666667" y="166" font-size="18" fill="#FAFAFA" fill-opacity="0.9">bringing in more sales.</text>
<text x="418.6666666666667" y="216" font-size="15" font-weight="600" fill="#FAFAFA">CEO</text>
<text x="418.6666666666667" y="236" font-size="13" fill="#71717A">Phoenix Education &amp; Automata One</text><rect x="390.6666666666667" y="96" width="1" height="124" fill="#27272A"/><text x="781.3333333333334" y="112" font-size="18" fill="#FAFAFA" fill-opacity="0.9">He really knows his craft. He</text><text x="781.3333333333334" y="139" font-size="18" fill="#FAFAFA" fill-opacity="0.9">built great websites for me, and</text><text x="781.3333333333334" y="166" font-size="18" fill="#FAFAFA" fill-opacity="0.9">for my friends too.</text>
<text x="781.3333333333334" y="216" font-size="15" font-weight="600" fill="#FAFAFA">Rahat Hassan</text>
<text x="781.3333333333334" y="236" font-size="13" fill="#71717A">Client</text><rect x="753.3333333333334" y="96" width="1" height="124" fill="#27272A"/>
</g>
<rect x="0.5" y="0.5" width="1199" height="259" rx="19.5" stroke="#27272A"/>
