<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" fill="none">
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8B5CF6"/><stop offset="0.5" stop-color="#F472B6"/><stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>
  <linearGradient id="cardbg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#14142A"/><stop offset="1" stop-color="#10101C"/>
  </linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" stroke="#ffffff" stroke-opacity="0.035"/>
  </pattern>
  
</defs>
<style>
  text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: 'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace; }
  
  .step { opacity: 0; animation: up .6s ease-out forwards; }
  @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
</style>

<path d="M120 62H1080" stroke="#26263D" stroke-width="2"/>
<path d="M120 62H1080" stroke="url(#brand)" stroke-width="2" stroke-dasharray="8 10">
  <animate attributeName="stroke-dashoffset" values="0;-180" dur="4s" repeatCount="indefinite"/>
</path>

<g class="step" style="animation-delay:0.0s">
  <circle cx="120" cy="62" r="34" fill="#0A0A12" stroke="#8B5CF6" stroke-width="2"/>
  <circle cx="120" cy="62" r="34" fill="#8B5CF6" fill-opacity="0.12"/>
  <text class="mono" x="120" y="69" text-anchor="middle" font-size="20" font-weight="700" fill="#8B5CF6">01</text>
  <text x="120" y="134" text-anchor="middle" font-size="20" font-weight="700" fill="#ECECF5">Discover</text>
  <text x="120" y="162" text-anchor="middle" font-size="14" fill="#9B9BB4">Goals, users, scope</text>
</g>
<g class="step" style="animation-delay:0.2s">
  <circle cx="360" cy="62" r="34" fill="#0A0A12" stroke="#A78BFA" stroke-width="2"/>
  <circle cx="360" cy="62" r="34" fill="#A78BFA" fill-opacity="0.12"/>
  <text class="mono" x="360" y="69" text-anchor="middle" font-size="20" font-weight="700" fill="#A78BFA">02</text>
  <text x="360" y="134" text-anchor="middle" font-size="20" font-weight="700" fill="#ECECF5">Plan</text>
  <text x="360" y="162" text-anchor="middle" font-size="14" fill="#9B9BB4">Architecture &amp; timeline</text>
</g>
<g class="step" style="animation-delay:0.4s">
  <circle cx="600" cy="62" r="34" fill="#0A0A12" stroke="#F472B6" stroke-width="2"/>
  <circle cx="600" cy="62" r="34" fill="#F472B6" fill-opacity="0.12"/>
  <text class="mono" x="600" y="69" text-anchor="middle" font-size="20" font-weight="700" fill="#F472B6">03</text>
  <text x="600" y="134" text-anchor="middle" font-size="20" font-weight="700" fill="#ECECF5">Build</text>
  <text x="600" y="162" text-anchor="middle" font-size="14" fill="#9B9BB4">Weekly demos &amp; updates</text>
</g>
<g class="step" style="animation-delay:0.6s">
  <circle cx="840" cy="62" r="34" fill="#0A0A12" stroke="#22D3EE" stroke-width="2"/>
  <circle cx="840" cy="62" r="34" fill="#22D3EE" fill-opacity="0.12"/>
  <text class="mono" x="840" y="69" text-anchor="middle" font-size="20" font-weight="700" fill="#22D3EE">04</text>
  <text x="840" y="134" text-anchor="middle" font-size="20" font-weight="700" fill="#ECECF5">Launch</text>
  <text x="840" y="162" text-anchor="middle" font-size="14" fill="#9B9BB4">Tested, deployed, live</text>
</g>
<g class="step" style="animation-delay:0.8s">
  <circle cx="1080" cy="62" r="34" fill="#0A0A12" stroke="#34D399" stroke-width="2"/>
  <circle cx="1080" cy="62" r="34" fill="#34D399" fill-opacity="0.12"/>
  <text class="mono" x="1080" y="69" text-anchor="middle" font-size="20" font-weight="700" fill="#34D399">05</text>
  <text x="1080" y="134" text-anchor="middle" font-size="20" font-weight="700" fill="#ECECF5">Support</text>
  <text x="1080" y="162" text-anchor="middle" font-size="14" fill="#9B9BB4">Docs, handover, care</text>
</g>

</svg>
