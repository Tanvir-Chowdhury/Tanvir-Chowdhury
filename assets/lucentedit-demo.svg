<g class="s0"><rect x="40" y="96" width="500" height="64" rx="12" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.35"/><text x="56" y="122" font-size="14" fill="#ECECF5">Design a 1280x640 launch card for my coffee shop, preview it,</text><text x="56" y="144" font-size="14" fill="#ECECF5">then export a PNG.</text></g><g class="s1"><text class="mono" x="40" y="190" font-size="13" fill="#9B9BB4">✻ Calling LucentEdit over MCP…</text></g><g class="s2"><text class="mono" x="40" y="222" font-size="14"><tspan fill='#34D399'>✓</tspan> <tspan fill='#22D3EE'>new_document</tspan><tspan fill='#9B9BB4'> { width: 1280, height: 640 }</tspan></text></g><g class="s3"><text class="mono" x="40" y="254" font-size="14"><tspan fill='#34D399'>✓</tspan> <tspan fill='#22D3EE'>add_shape</tspan><tspan fill='#9B9BB4'> { shape: 'rect', fill: gradient }</tspan></text></g><g class="s4"><text class="mono" x="40" y="286" font-size="14"><tspan fill='#34D399'>✓</tspan> <tspan fill='#22D3EE'>add_text</tspan><tspan fill='#9B9BB4'> { text: 'Brew Day', font_size: 96 }</tspan></text></g><g class="s5"><text class="mono" x="40" y="318" font-size="14"><tspan fill='#34D399'>✓</tspan> <tspan fill='#22D3EE'>add_shape</tspan><tspan fill='#9B9BB4'> { shape: 'star', points: 8 }</tspan></text></g><g class="s6"><text class="mono" x="40" y="350" font-size="14"><tspan fill='#34D399'>✓</tspan> <tspan fill='#22D3EE'>update_layer</tspan><tspan fill='#9B9BB4'> { effects: { glow } }</tspan></text></g><g class="s7"><text class="mono" x="40" y="382" font-size="14"><tspan fill='#34D399'>✓</tspan> <tspan fill='#22D3EE'>render_preview</tspan><tspan fill='#9B9BB4'> { }  → looks great</tspan></text></g><g class="s8"><text class="mono" x="40" y="414" font-size="14"><tspan fill='#34D399'>✓</tspan> <tspan fill='#22D3EE'>export_document</tspan><tspan fill='#9B9BB4'> { format: 'png' }</tspan></text></g>
<g class="s2"><rect x="512" y="146" width="112" height="24" rx="5" fill="#ffffff" fill-opacity="0.04"/><text x="520" y="162" font-size="12" fill="#9B9BB4">▢ Background</text></g><g class="s3"><rect x="512" y="176" width="112" height="24" rx="5" fill="#ffffff" fill-opacity="0.04"/><text x="520" y="192" font-size="12" fill="#9B9BB4">▢ Gradient</text></g><g class="s4"><rect x="512" y="206" width="112" height="24" rx="5" fill="#ffffff" fill-opacity="0.04"/><text x="520" y="222" font-size="12" fill="#9B9BB4">▢ Brew Day</text></g><g class="s5"><rect x="512" y="236" width="112" height="24" rx="5" fill="#ffffff" fill-opacity="0.04"/><text x="520" y="252" font-size="12" fill="#9B9BB4">▢ Star</text></g><g class="s6"><rect x="512" y="266" width="112" height="24" rx="5" fill="#ffffff" fill-opacity="0.04"/><text x="520" y="282" font-size="12" fill="#9B9BB4">▢ Glow</text></g>

