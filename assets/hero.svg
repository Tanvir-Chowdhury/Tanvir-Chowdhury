<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" fill="none">
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8B5CF6"/><stop offset="0.5" stop-color="#F472B6"/><stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>
  <linearGradient id="cardbg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#14142A"/><stop offset="1" stop-color="#10101C"/>
  </linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" stroke="#ffffff" stroke-opacity="0.035"/>
  </pattern>
  
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.45" stop-color="#A78BFA"/>
    <stop offset="0.7" stop-color="#F472B6"/><stop offset="1" stop-color="#22D3EE"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-0.3 0;0.3 0;-0.3 0" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
</defs>
<style>
  text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: 'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace; }
  
  .fade { opacity: 0; animation: up .8s ease-out forwards; }
  @keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .ping { transform-origin: 86px 81px; animation: ping 1.6s ease-out infinite; }
  @keyframes ping { from { transform: scale(1); opacity: .8; } to { transform: scale(2.8); opacity: 0; } }
  .float { animation: float 6s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>

<rect width="1200" height="440" rx="24" fill="#0A0A12"/>
<rect width="1200" height="440" rx="24" fill="url(#grid)"/>
<g filter="url(#blur)" opacity="0.55">
  <circle cx="220" cy="120" r="150" fill="#8B5CF6">
    <animate attributeName="cx" values="220;330;220" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="120;200;120" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="330" r="160" fill="#22D3EE" fill-opacity="0.7">
    <animate attributeName="cx" values="980;860;980" dur="16s" repeatCount="indefinite"/>
  </circle>
  <circle cx="640" cy="420" r="120" fill="#F472B6" fill-opacity="0.6">
    <animate attributeName="cy" values="420;340;420" dur="12s" repeatCount="indefinite"/>
  </circle>
</g>
<rect x="0.5" y="0.5" width="1199" height="439" rx="24" stroke="#26263D"/>

<g class="fade" style="animation-delay:.1s">
  <rect x="64" y="64" width="290" height="34" rx="17" fill="#34D399" fill-opacity="0.10" stroke="#34D399" stroke-opacity="0.4"/>
  <circle cx="86" cy="81" r="5" fill="#34D399"/>
  <circle cx="86" cy="81" r="5" fill="#34D399" class="ping"/>
  <text class="mono" x="102" y="86" font-size="13" fill="#34D399" letter-spacing="1.5">AVAILABLE FOR NEW PROJECTS</text>
</g>
<g class="fade" style="animation-delay:.3s">
  <text x="62" y="172" font-size="60" font-weight="800" fill="url(#shine)" letter-spacing="-1.5">Md Tanvir Chowdhury</text>
</g>
<g class="fade" style="animation-delay:.5s">
  <text x="64" y="222" font-size="26" font-weight="600" fill="#ECECF5">Full-Stack &amp; AI Engineer</text>
</g>
<g class="fade" style="animation-delay:.7s">
  <text x="64" y="262" font-size="18" fill="#9B9BB4">I turn ideas into fast, secure, AI-powered products</text>
  <text x="64" y="288" font-size="18" fill="#9B9BB4">that real users love and businesses can grow on.</text>
</g>
<g class="fade" style="animation-delay:.9s"><rect x="64" y="326" width="72" height="27" rx="13.5" fill="#A78BFA" fill-opacity="0.10" stroke="#A78BFA" stroke-opacity="0.35"/><text class="mono" x="100.0" y="342" text-anchor="middle" font-size="13" fill="#A78BFA">Django</text><rect x="144" y="326" width="80" height="27" rx="13.5" fill="#22D3EE" fill-opacity="0.10" stroke="#22D3EE" stroke-opacity="0.35"/><text class="mono" x="184.0" y="342" text-anchor="middle" font-size="13" fill="#22D3EE">FastAPI</text><rect x="232" y="326" width="64" height="27" rx="13.5" fill="#F472B6" fill-opacity="0.10" stroke="#F472B6" stroke-opacity="0.35"/><text class="mono" x="264.0" y="342" text-anchor="middle" font-size="13" fill="#F472B6">React</text><rect x="304" y="326" width="48" height="27" rx="13.5" fill="#A78BFA" fill-opacity="0.10" stroke="#A78BFA" stroke-opacity="0.35"/><text class="mono" x="328.0" y="342" text-anchor="middle" font-size="13" fill="#A78BFA">Vue</text><rect x="360" y="326" width="48" height="27" rx="13.5" fill="#22D3EE" fill-opacity="0.10" stroke="#22D3EE" stroke-opacity="0.35"/><text class="mono" x="384.0" y="342" text-anchor="middle" font-size="13" fill="#22D3EE">RAG</text><rect x="416" y="326" width="56" height="27" rx="13.5" fill="#F472B6" fill-opacity="0.10" stroke="#F472B6" stroke-opacity="0.35"/><text class="mono" x="444.0" y="342" text-anchor="middle" font-size="13" fill="#F472B6">LLMs</text><rect x="480" y="326" width="48" height="27" rx="13.5" fill="#A78BFA" fill-opacity="0.10" stroke="#A78BFA" stroke-opacity="0.35"/><text class="mono" x="504.0" y="342" text-anchor="middle" font-size="13" fill="#A78BFA">MCP</text><rect x="536" y="326" width="104" height="27" rx="13.5" fill="#22D3EE" fill-opacity="0.10" stroke="#22D3EE" stroke-opacity="0.35"/><text class="mono" x="588.0" y="342" text-anchor="middle" font-size="13" fill="#22D3EE">PostgreSQL</text></g>
<g class="fade" style="animation-delay:1.1s">
  <text class="mono" x="64" y="398" font-size="13" fill="#9B9BB4">Dhaka, Bangladesh  ·  Remote, worldwide  ·  CSE @ North South University</text>
</g>

<g class="float">
  <rect x="748" y="96" width="388" height="262" rx="16" fill="#0E0E1A" fill-opacity="0.85" stroke="url(#brand)" stroke-opacity="0.6"/>
  <rect x="748" y="96" width="388" height="40" rx="16" fill="#ffffff" fill-opacity="0.03"/>
  <circle cx="772" cy="116" r="6" fill="#FF5F57"/><circle cx="792" cy="116" r="6" fill="#FEBC2E"/><circle cx="812" cy="116" r="6" fill="#28C840"/>
  <text class="mono" x="1112" y="121" text-anchor="end" font-size="12" fill="#9B9BB4">tanvir.ts</text>
  <text class="mono" x="776" y="176" font-size="15" fill="#ECECF5"><tspan fill='#C084FC'>const</tspan> <tspan fill='#7DD3FC'>tanvir</tspan> = {</text><text class="mono" x="798" y="203" font-size="15" fill="#ECECF5">role: <tspan fill='#86EFAC'>'Full-Stack &amp; AI Engineer'</tspan>,</text><text class="mono" x="798" y="230" font-size="15" fill="#ECECF5">ships: <tspan fill='#86EFAC'>'production-ready'</tspan>,</text><text class="mono" x="798" y="257" font-size="15" fill="#ECECF5">stack: [<tspan fill='#86EFAC'>'Python'</tspan>, <tspan fill='#86EFAC'>'TS'</tspan>, <tspan fill='#86EFAC'>'AI'</tspan>],</text><text class="mono" x="798" y="284" font-size="15" fill="#ECECF5">loves: <tspan fill='#86EFAC'>'hard problems'</tspan>,</text><text class="mono" x="798" y="311" font-size="15" fill="#ECECF5">available: <tspan fill='#FBBF24'>true</tspan>,</text><text class="mono" x="776" y="338" font-size="15" fill="#ECECF5">};</text>
  <rect x="806" y="333" width="9" height="17" fill="#A78BFA" class="blink"/>
</g>

</svg>
