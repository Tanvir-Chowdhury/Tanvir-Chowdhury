<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" fill="none">
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8B5CF6"/><stop offset="0.5" stop-color="#F472B6"/><stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>
  <linearGradient id="cardbg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#14142A"/><stop offset="1" stop-color="#10101C"/>
  </linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" stroke="#ffffff" stroke-opacity="0.035"/>
  </pattern>
  
</defs>
<style>
  text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: 'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace; }
  
  .card { opacity: 0; animation: up .7s ease-out forwards; }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
</style>

<g class="card" style="animation-delay:0.0s">
  <rect x="0.5" y="0.5" width="383" height="279" rx="18" fill="url(#cardbg)" stroke="#26263D"/>
  <circle cx="354" cy="20" r="80" fill="#8B5CF6" opacity="0.16" filter="url(#soft)"/>
  <rect x="32" y="0" width="80" height="3" rx="1.5" fill="#8B5CF6"/>
  <text x="28" y="74" font-size="64" font-weight="800" fill="#8B5CF6" opacity="0.55" font-family="Georgia, serif">“</text>
  <text x="32" y="100" font-size="18" fill="#ECECF5">Tanvir has done a great job with</text><text x="32" y="130" font-size="18" fill="#ECECF5">our marketing and has played a big</text><text x="32" y="160" font-size="18" fill="#ECECF5">part in bringing in more sales for</text><text x="32" y="190" font-size="18" fill="#ECECF5">us.</text>
  <rect x="32" y="188" width="320" height="1" fill="#26263D"/>
  <circle cx="56" cy="232" r="22" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-opacity="0.5"/>
  <text x="56" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="#8B5CF6">C</text>
  <text x="90" y="227" font-size="16" font-weight="700" fill="#ECECF5">CEO</text>
  <text x="90" y="248" font-size="13" fill="#9B9BB4">Phoenix Education &amp; Automata One</text>
</g>
<g class="card" style="animation-delay:0.2s">
  <rect x="408.5" y="0.5" width="383" height="279" rx="18" fill="url(#cardbg)" stroke="#26263D"/>
  <circle cx="762" cy="20" r="80" fill="#22D3EE" opacity="0.16" filter="url(#soft)"/>
  <rect x="440" y="0" width="80" height="3" rx="1.5" fill="#22D3EE"/>
  <text x="436" y="74" font-size="64" font-weight="800" fill="#22D3EE" opacity="0.55" font-family="Georgia, serif">“</text>
  <text x="440" y="100" font-size="18" fill="#ECECF5">Tanvir really knows his craft. He</text><text x="440" y="130" font-size="18" fill="#ECECF5">built great websites for me, and</text><text x="440" y="160" font-size="18" fill="#ECECF5">for my friends too.</text>
  <rect x="440" y="188" width="320" height="1" fill="#26263D"/>
  <circle cx="464" cy="232" r="22" fill="#22D3EE" fill-opacity="0.15" stroke="#22D3EE" stroke-opacity="0.5"/>
  <text x="464" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="#22D3EE">RH</text>
  <text x="498" y="227" font-size="16" font-weight="700" fill="#ECECF5">Rahat Hassan</text>
  <text x="498" y="248" font-size="13" fill="#9B9BB4">Client</text>
</g>
<g class="card" style="animation-delay:0.4s">
  <rect x="816.5" y="0.5" width="383" height="279" rx="18" fill="url(#cardbg)" stroke="#26263D"/>
  <circle cx="1170" cy="20" r="80" fill="#F472B6" opacity="0.16" filter="url(#soft)"/>
  <rect x="848" y="0" width="80" height="3" rx="1.5" fill="#F472B6"/>
  <text x="844" y="74" font-size="64" font-weight="800" fill="#F472B6" opacity="0.55" font-family="Georgia, serif">“</text>
  <text x="848" y="100" font-size="18" fill="#ECECF5">Tanvir built a great website for</text><text x="848" y="130" font-size="18" fill="#ECECF5">me last time. That's exactly why I</text><text x="848" y="160" font-size="18" fill="#ECECF5">came back to him for my next</text><text x="848" y="190" font-size="18" fill="#ECECF5">project.</text>
  <rect x="848" y="188" width="320" height="1" fill="#26263D"/>
  <circle cx="872" cy="232" r="22" fill="#F472B6" fill-opacity="0.15" stroke="#F472B6" stroke-opacity="0.5"/>
  <text x="872" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="#F472B6">A</text>
  <text x="906" y="227" font-size="16" font-weight="700" fill="#ECECF5">Ahein</text>
  <text x="906" y="248" font-size="13" fill="#9B9BB4">Returning client</text>
</g>
</svg>
